<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos - IsaacDaSigma</title>

  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Luckiest Guy', cursive;
      background: linear-gradient(135deg, #000000, #ff0000, #ffffff);
      background-attachment: fixed;
      color: white;
      min-height: 100vh;
    }

    /* Navigation Bar */
    nav {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      padding: 15px 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border-bottom: 2px solid #ff0000;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 1.2rem;
      transition: color 0.3s, text-shadow 0.3s;
    }

    nav a:hover {
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
    }

    .section {
      margin: 60px auto;
      text-align: center;
      max-width: 1200px;
      padding: 0 20px;
    }

    .section h2 {
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 2px 2px 5px black;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    /* Video Grid (Standard 16:9) */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    /* Shorts Specific Grid - Set to 280px to keep the short smaller */
    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 280px));
      gap: 20px;
      justify-content: center; /* Centers the short if there is only one */
      margin-bottom: 50px;
    }

    .video-card {
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .video-card:hover {
      transform: scale(1.04);
      box-shadow: 0 0 20px #ff0000;
    }

    .video-card h3 {
      margin-bottom: 15px;
      font-size: 1.1rem;
      color: #ff0000;
      text-shadow: 1px 1px 5px black;
    }

    /* Standard Video Aspect Ratio */
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
    }

    /* Shorts Aspect Ratio */
    .shorts-container {
      position: relative;
      padding-bottom: 177.77%; /* 9:16 */
      height: 0;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      border: none;
    }

    footer {
      padding: 50px 0;
      font-size: 0.9rem;
      color: #ccc;
      text-align: center;
      background: rgba(0,0,0,0.8);
      border-top: 1px solid #ff0000;
    }

    hr {
      border: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.5), transparent);
      width: 80%;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <nav>

  </nav>

            src="https://www.youtube.com/embed/57bq4_v9NtY"

            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </div>
  </div>

  <hr>

  <div class="section">
    <h2>Featured Videos</h2>
    <div class="video-grid">

      <div class="video-card">
        <h3>Epic Victory Royale</h3>
        <div class="video-container">

      <div class="video-card">

    </div>
  </div>

</body>
</html>
