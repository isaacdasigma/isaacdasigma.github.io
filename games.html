<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Class of '09 - Isaac's Version</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0 none; background: #000; }
        #statusDiv { background: rgba(0, 0, 0, .8); width: 50%; margin: auto; min-width: 300px; padding: 20px; position: absolute; top: 20%; left: 0; right: 0; border-radius: 10px; color: #fff; text-align: center; z-index: 10; }
        progress { width: 100%; height: 20px; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    
    <div id="statusDiv">
        <div id="statusTextDiv">Downloading Game Assets...</div>
        <progress id="statusProgress" max="100" value="0"></progress>
    </div>

    <script>
        // CRITICAL: This must match your file name exactly!
        window.gameZipUrl = "game.zip"; 

        // Load the engine scripts from a stable source
        const scripts = [
            "https://cdn.jsdelivr.net/gh/genizy/web-port@main/class-of-09/renpy-pre.js",
            "https://cdn.jsdelivr.net/gh/genizy/web-port@main/class-of-09/renpy.js"
        ];

        scripts.forEach(src => {
            let s = document.createElement("script");
            s.src = src;
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
