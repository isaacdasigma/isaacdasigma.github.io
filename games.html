<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games - IsaacDaSigma</title>

  <!-- Fortnite-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Luckiest Guy', cursive;
      background: linear-gradient(135deg, #000000, #ff0000, #ffffff);
      color: white;
      min-height: 100vh;
    }

    /* Navigation Bar */
    nav {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      padding: 15px 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ff0000;
    }

    header {
      text-align: center;
      margin: 60px 20px 40px 20px;
    }

    header h1 {
      font-size: 3rem;
      color: #ff0000;
      text-shadow: 2px 2px 10px black;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      text-shadow: 1px 1px 5px black;
    }

    .section {
      margin: 50px 20px;
      text-align: center;
    }

    .section h2 {
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 1px 1px 5px black;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 12px;
      margin: 20px auto;
      max-width: 900px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px #ff0000;
    }

    iframe {
      width: 100%;
      height: 450px;
      border-radius: 12px;
      border: none;
      margin-top: 15px;
    }

    footer {
      margin: 50px 0;
      font-size: 0.9rem;
      color: #ccc;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html">Home</a>
    <a href="stream.html">Streams</a>
    <a href="videos.html">Videos</a>
    <a href="about.html">About</a>
  </nav>

  <!-- Header -->
  <header>
    <h1>Games</h1>
    <p>Play games while watching the stream 🎮🔥</p>
  </header>

  <!-- Featured Game -->
  <div class="section">
    <h2>Featured Game</h2>
    <div class="card">
      <p>🔥 Try this game while you chill on the stream</p>
      <iframe src="https://itch.io/embed-upload/10235322?color=333333"></iframe>
    </div>
  </div>

  <!-- More Games -->
  <div class="section">
    <h2>More Games</h2>

    <div class="card">
      <p>🎯 Quick arcade action</p>
      <iframe src="https://itch.io/embed-upload/10123456?color=333333"></iframe>
    </div>

    <div class="card">
      <p>🧠 Test your skills</p>
      <iframe src="https://itch.io/embed-upload/10000000?color=333333"></iframe>
    </div>

  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 IsaacDaSigma. All rights reserved.
  </footer>

</body>
</html>
