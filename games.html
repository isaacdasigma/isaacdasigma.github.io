<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Game - IsaacDaSigma</title>
  <style>
    /* Force the page to have no margins and hide scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* The game container fills the entire browser window */
    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
      // EmulatorJS Configuration
      EJS_player = "#game";
      EJS_core = "gba"; 
      
      /* Using the Githack CDN which is usually more stable for 
         GitHub Pages than the default EmulatorJS CDN.
      */
      EJS_pathtodata = "https://raw.githack.com/EmulatorJS/EmulatorJS/main/data/"; 
      
      /* IMPORTANT: Change this to the EXACT filename of the ROM 
         you upload to your GitHub repository.
      */
      EJS_gameUrl = "pokemon.zip"; 
  </script>
  
  <script src="https://raw.githack.com/EmulatorJS/EmulatorJS/main/data/loader.js"></script>

</body>
</html>
