<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Class of '09</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Full screen setup */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0 none; background: #000; }
        
        /* UI Elements */
        #statusDiv { background: rgba(0, 0, 0, .75); width: 50%; margin: auto; min-width: 340px; padding: 10px; position: absolute; top: 0; left: 0; right: 0; border-radius: 0 0 5px 5px; color: #ccc; text-align: center; z-index: 10; }
        .hidden { display: none; }
        #ContextContainer { position: absolute; left: 0; top: 0; z-index: 20; }
        #ContextButton { color: #d3d3d3; font-size: xx-large; cursor: pointer; padding: 10px; opacity: .75; text-decoration: none; }
    </style>
</head>

<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    
    <div id="statusDiv">
        <div id="statusTextDiv">Loading Game...</div>
        <progress id="statusProgress" max="100" value="0"></progress>
    </div>

    <div id="ContextContainer">
        <a id="ContextButton">≡</a>
    </div>

    <script>
        /* 1. CONFIGURATION */
        // Change "game.zip" to your actual game filename if it's different
        window.gameZipUrl = "game.zip"; 

        /* 2. LOAD RENPY ENGINE */
        const loadScript = (url) => {
            return new Promise((resolve) => {
                let s = document.createElement("script");
                s.src = url;
                s.onload = resolve;
                document.body.appendChild(s);
            });
        };

        async function startEngine() {
            // Loading the required Ren'Py web scripts from a stable CDN
            await loadScript("https://cdn.jsdelivr.net/gh/genizy/web-port@main/class-of-09/renpy-pre.js");
            await loadScript("https://cdn.jsdelivr.net/gh/genizy/web-port@main/class-of-09/renpy.js");
        }

        startEngine();
    </script>
</body>
</html>
