<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI 20.0 - Cloud Edition</title>
  <style>
    :root {
      --bg: #070a12;
      --panel: #0f172a;
      --header: #020617;
      --accent: #38bdf8;
      --glow: #818cf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --user-msg: #4338ca;
      --bot-msg: #1e1b4b;
      --border: rgba(129, 140, 248, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 94vh;
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .chat-header {
      background: var(--header);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-info h4 { margin: 0; font-size: 15px; color: var(--accent); }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: var(--glow); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: rgba(129, 140, 248, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-action:hover { background: rgba(129, 140, 248, 0.25); }

    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

    .input-area { display: flex; padding: 12px 14px; background: var(--header); gap: 8px; border-top: 1px solid var(--border); }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    button.send-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--accent), var(--glow));
      color: #0f172a;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
    }
    button.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Key Setup Modal */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 420px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin: 0 0 8px; color: var(--accent); font-size: 16px; }
    .modal-box p { font-size: 12px; color: var(--subtext); line-height: 1.4; margin-bottom: 12px; }
    .modal-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--header);
      color: var(--text);
      box-sizing: border-box;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <h4>Kris AI 20.0</h4>
      <p id="engineStatus">● Cloud API Mode (Zero RAM)</p>
    </div>
    <div class="header-controls">
      <button type="button" class="btn-action" onclick="openKeyModal()">🔑 API Key</button>
      <button type="button" class="btn-action" onclick="clearChat()">🧹 Clear</button>
    </div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <div class="modal-overlay" id="keyModal">
    <div class="modal-box">
      <h3>Set Free Cloud API Key</h3>
      <p>Enter a free <b>Groq</b> or <b>HuggingFace</b> API key below. This allows Kris AI to answer instantly without freezing or downloading huge models to your Chromebook.</p>
      <input type="password" id="apiKeyInput" placeholder="gsk_... or hf_...">
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="btn-action" onclick="closeKeyModal()">Cancel</button>
        <button type="button" class="btn-action" style="background:var(--user-msg)" onclick="saveApiKey()">Save Key</button>
      </div>
    </div>
  </div>
</div>

<script>
  let history = [];
  let apiKey = localStorage.getItem("kris_ai_key") || "";

  function appendMessage(text, role) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `message ${role}`;
    msg.innerHTML = text.replace(/\n/g, '<br>');
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  function openKeyModal() {
    document.getElementById("apiKeyInput").value = apiKey;
    document.getElementById("keyModal").style.display = "flex";
  }

  function closeKeyModal() {
    document.getElementById("keyModal").style.display = "none";
  }

  function saveApiKey() {
    apiKey = document.getElementById("apiKeyInput").value.trim();
    localStorage.setItem("kris_ai_key", apiKey);
    closeKeyModal();
    appendMessage("<b>System:</b> API Key updated successfully!", "bot");
  }

  function clearChat() {
    history = [];
    document.getElementById("chatBox").innerHTML = '';
    appendMessage("<b>Kris AI Ready!</b><br>How can I help you today?", "bot");
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const userText = input.value.trim();

    if (!userText) return;

    appendMessage(userText, "user");
    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    history.push({ role: "user", content: userText });
    if (history.length > 6) history = history.slice(-6);

    const botMsg = appendMessage("Thinking...", "bot");

    if (!apiKey) {
      botMsg.innerHTML = "⚠️ <b>API Key Missing</b><br>Click 🔑 <b>API Key</b> at the top right and paste your free key (Groq or HuggingFace) to enable responses without crashing.";
      input.disabled = false;
      sendBtn.disabled = false;
      return;
    }

    try {
      let responseText = "";
      
      // Supports Groq API Keys (gsk_) or standard OpenAI-compatible endpoints
      const isGroq = apiKey.startsWith("gsk_");
      const endpoint = isGroq 
        ? "https://api.groq.com/openai/v1/chat/completions" 
        : "https://api-inference.huggingface.co/v1/chat/completions";
      
      const modelName = isGroq ? "llama-3.1-8b-instant" : "meta-llama/Llama-3.2-3B-Instruct";

      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: modelName,
          messages: [
            { role: "system", content: "Your name is Kris AI. Answer directly, accurately, and concisely." },
            ...history
          ],
          max_tokens: 150,
          temperature: 0.3
        })
      });

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message || JSON.stringify(data.error));
      }

      responseText = data.choices[0].message.content.trim();
      botMsg.innerHTML = responseText.replace(/\n/g, '<br>');
      history.push({ role: "assistant", content: responseText });

    } catch (err) {
      console.error(err);
      botMsg.innerHTML = `⚠️ <b>Connection Error:</b> ${err.message}`;
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // Initial greeting
  appendMessage("<b>Kris AI Ready (Cloud Mode)!</b><br>Runs instantly on Chromebooks without downloading heavy files. Click 🔑 <b>API Key</b> to link your free key.", "bot");
</script>
</body>
</html>
