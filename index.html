<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI 14.1 - Sandbox Optimized</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151d2a;
      --header: #0f172a;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --user-msg: #0284c7;
      --bot-msg: #243144;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 94vh;
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: var(--header);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-info h4 { margin: 0; font-size: 15px; color: var(--text); }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: var(--accent); }

    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.05);
      height: 4px;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text); border-bottom-left-radius: 4px; }

    .input-area { display: flex; padding: 12px 14px; background: var(--header); gap: 8px; }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }

    button.send-btn {
      padding: 12px 18px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
    }
    button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <h4>Kris AI 14.1 (Low-RAM Edition)</h4>
      <p id="engineStatus">● Initializing...</p>
    </div>
    <button type="button" style="background:none;border:1px solid var(--border);color:var(--subtext);border-radius:6px;padding:4px 8px;cursor:pointer;" onclick="clearChat()">🧹 Clear</button>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Loading low-RAM model..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="send-btn" id="sendBtn" disabled onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
  import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers';

  env.allowLocalModels = false;
  env.useBrowserCache = true;
  
  // Restrict WASM workers to prevent memory explosion in sandboxed iframes
  if (env.backends && env.backends.onnx && env.backends.onnx.wasm) {
    env.backends.onnx.wasm.numThreads = 1;
  }

  let generator = null;
  let activeBotMsg = null;
  let history = [];

  function updateStatus(text, progress = 0) {
    document.getElementById('engineStatus').textContent = text;
    if (progress > 0) {
      document.getElementById('progressBar').style.width = `${progress}%`;
    }
  }

  function appendBotMessage(text) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = "message bot";
    msg.innerHTML = DOMPurify.sanitize(text);
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  window.clearChat = function() {
    history = [];
    document.getElementById("chatBox").innerHTML = '';
    appendBotMessage("Memory cleared! What's on your mind?");
  };

  async function initEngine() {
    const device = !!navigator.gpu ? 'webgpu' : 'wasm';
    updateStatus(`● Downloading 360M Engine (${device.toUpperCase()})...`, 5);

    try {
      // SmolLM2 360M fits well within CodeSandbox memory limits (~350MB max RAM footprint)
      generator = await pipeline('text-generation', 'onnx-community/SmolLM2-360M-Instruct-ONNX', {
        device: device,
        dtype: 'q4',
        progress_callback: (p) => {
          if (p.status === 'progress') {
            updateStatus(`● Loading Weights (${Math.round(p.progress || 0)}%)...`, Math.round(p.progress || 0));
          }
        }
      });

      updateStatus(`● Ready (${device.toUpperCase()})`, 100);
      document.getElementById('userInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('userInput').placeholder = 'Type a message...';
      appendBotMessage("<b>Engine Ready!</b><br>I'm Kris AI (360M). Smart, lightweight, and sandbox-safe.");
    } catch (err) {
      updateStatus(`⚠️ Engine Error`);
      appendBotMessage(`<b>Failed to load model:</b> ${err.message}`);
    }
  }

  window.sendMessage = async function() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const text = input.value.trim();

    if (!text || !generator) return;

    const chatBox = document.getElementById("chatBox");
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chatBox.appendChild(userMsg);

    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    history.push({ role: 'user', content: text });
    if (history.length > 4) history.shift();

    activeBotMsg = document.createElement("div");
    activeBotMsg.className = "message bot";
    chatBox.appendChild(activeBotMsg);

    let prompt = `<|im_start|>system\nYou are Kris AI, a smart and helpful assistant. Understand user slang and answer directly.<|im_end|>\n`;
    history.forEach(item => {
      prompt += `<|im_start|>${item.role}\n${item.content}<|im_end|>\n`;
    });
    prompt += `<|im_start|>assistant\n`;

    let responseText = "";

    const streamer = new TextStreamer(generator.tokenizer, {
      skip_prompt: true,
      skip_special_tokens: true,
      callback_function: (chunk) => {
        responseText += chunk;
        activeBotMsg.textContent = responseText;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });

    try {
      await generator(prompt, {
        max_new_tokens: 300,
        do_sample: true,
        temperature: 0.5,
        top_k: 30,
        repetition_penalty: 1.15,
        streamer: streamer,
        stop: ["<|im_end|>", "<|endoftext|>"]
      });

      history.push({ role: 'assistant', content: responseText.trim() });
    } catch (e) {
      activeBotMsg.textContent = "⚠️ Memory limit reached or error generating response.";
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  };

  initEngine();
</script>
</body>
</html>
