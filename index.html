<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI 20.0 - Browser LLM Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --panel: #0f172a;
      --header: #020617;
      --accent: #38bdf8;
      --glow: #818cf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --user-msg: #4338ca;
      --bot-msg: #1e1b4b;
      --border: rgba(129, 140, 248, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 94vh;
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: var(--header);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-info h4 { margin: 0; font-size: 15px; color: var(--accent); }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: var(--glow); }

    .memory-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(129, 140, 248, 0.2);
      color: var(--glow);
      border: 1px solid var(--border);
    }

    .btn-clear {
      background: none;
      border: 1px solid var(--border);
      color: var(--subtext);
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-clear:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .progress-container { width: 100%; background: rgba(255,255,255,0.05); height: 4px; }
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--glow)); transition: width 0.1s linear; }

    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
