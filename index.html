<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Team Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c2f33;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .panel {
            background-color: #23272a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .chat-box {
            flex: 2;
        }
        .check-in-box {
            flex: 1;
        }
        h2 {
            margin-top: 0;
            color: #7289da;
        }
        .message-area {
            height: 300px;
            background-color: #2c2f33;
            border-radius: 5px;
            padding: 10px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: calc(100% - 80px);
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            background-color: #7289da;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #5b6eae;
        }
    </style>
</head>
<body>

    <div class="panel chat-box">
        <h2>Mod Chat</h2>
        <div class="message-area">
            <p><strong>System:</strong> Welcome to the Mod Hub!</p>
            </div>
        <input type="text" placeholder="Type a message...">
        <button>Send</button>
    </div>

    <div class="panel check-in-box">
        <h2>Daily Check-In</h2>
        <p>Click below to log your activity for today.</p>
        <button style="width: 100%; margin-bottom: 10px;">I'm Online!</button>
        <h3>Recent Check-ins:</h3>
        <ul>
            <li>Mod1 - 10:00 AM</li>
            <li>Mod2 - 11:30 AM</li>
        </ul>
    </div>

</body>
</html>
