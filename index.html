<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Entry Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      max-width: 360px;
      width: 100%;
    }
    h1 { font-size: 24px; color: #f8fafc; margin-bottom: 12px; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      border-radius: 24px;
      transition: background 0.2s;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome Portal</h1>
    <p>Beat the challenge game to unlock the Kris 5.7 AI system.</p>
    <a href="games.html" class="btn">Play Game →</a>
  </div>
</body>
</html>
