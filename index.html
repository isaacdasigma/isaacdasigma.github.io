<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI - Browser Native</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    #chatbox { width: 90%; max-width: 650px; height: 65vh; background: #1e1e1e; border-radius: 12px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .msg { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
    .user { background: #007acc; color: #fff; align-self: flex-end; }
    .kris { background: #2d2d2d; color: #e0e0e0; align-self: flex-start; border: 1px solid #333; width: 80%; }
    
    /* Progress Bar Styles */
    .progress-container { width: 100%; background-color: #444; border-radius: 4px; overflow: hidden; margin-top: 10px; height: 6px; display: none; }
    .progress-bar { width: 0%; height: 100%; background-color: #007acc; transition: width 0.1s linear; }
    .progress-text { font-size: 0.75em; color: #888; margin-top: 4px; text-align: right; }

    #status { font-size: 0.9em; color: #aaa; margin-bottom: 8px; width: 90%; max-width: 650px; text-align: left; }
    #input-area { display: flex; width: 90%; max-width: 650px; margin-top: 12px; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; outline: none; }
    button { padding: 12px 24px; border: none; border-radius: 8px; background: #007acc; color: #fff; cursor: pointer; font-weight: bold; }
    button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Kris AI (In-Browser)</h2>
  <div id="status">Status: Initializing WebGPU...</div>
  <div id="chatbox"></div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="Downloading model..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const MODEL_ID = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
    const MAX_TOKENS = 512; // Maximum response token budget
    let engine;
    
    const conversationHistory = [
      { role: "system", content: "You are Kris, an intelligent AI assistant running 100% locally in the user's browser." }
    ];

    const statusDiv = document.getElementById("status");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function init() {
      try {
        engine = await CreateMLCEngine(MODEL_ID, {
          initProgressCallback: (progress) => {
            const percent = Math.round(progress.progress * 100);
            statusDiv.innerText = `Status: Loading Kris... (${percent}%) ${progress.text}`;
          }
        });
        statusDiv.innerText = "Status: Kris is ready! (100% In-Browser)";
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.placeholder = "Ask Kris anything...";
      } catch (err) {
        statusDiv.innerText = "Error: WebGPU support required (use modern Chrome, Edge, or Safari).";
      }
    }

    window.sendMessage = async function() {
      const text = userInput.value.trim();
      if (!text || !engine) return;

      appendMessage(text, "user");
      conversationHistory.push({ role: "user", content: text });
      userInput.value = "";

      userInput.disabled = true;
      sendBtn.disabled = true;

      const { contentDiv, progressBar, progressText, progressContainer } = appendAssistantMessage();
      progressContainer.style.display = "block";

      try {
        const stream = await engine.chat.completions.create({
          messages: conversationHistory,
          max_tokens: MAX_TOKENS,
          temperature: 0.7,
          stream: true
        });

        let fullReply = "";
        let tokenCount = 0;

        for await (const chunk of stream) {
          const delta = chunk.choices[0]?.delta?.content || "";
          fullReply += delta;
          tokenCount++;

          contentDiv.innerText = fullReply;

          // Track generation completion against maximum token allocation
          const progressPercent = Math.min(Math.round((tokenCount / MAX_TOKENS) * 100), 99);
          progressBar.style.width = `${progressPercent}%`;
          progressText.innerText = `${progressPercent}% generated`;

          const chatbox = document.getElementById("chatbox");
          chatbox.scrollTop = chatbox.scrollHeight;
        }

        // Complete the bar upon stream finish
        progressBar.style.width = "100%";
        progressText.innerText = "100% complete";
        conversationHistory.push({ role: "assistant", content: fullReply });
      } catch (err) {
        contentDiv.innerText = "Error generating response.";
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    };

    function appendMessage(text, sender) {
      const chatbox = document.getElementById("chatbox");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatbox.appendChild(msgDiv);
      chatbox.scrollTop = chatbox.scrollHeight;
      return msgDiv;
    }

    function appendAssistantMessage() {
      const chatbox = document.getElementById("chatbox");
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg kris";

      const contentDiv = document.createElement("div");
      contentDiv.innerText = "Thinking...";

      const progressContainer = document.createElement("div");
      progressContainer.className = "progress-container";

      const progressBar = document.createElement("div");
      progressBar.className = "progress-bar";

      const progressText = document.createElement("div");
      progressText.className = "progress-text";
      progressText.innerText = "0%";

      progressContainer.appendChild(progressBar);
      msgDiv.appendChild(contentDiv);
      msgDiv.appendChild(progressContainer);
      msgDiv.appendChild(progressText);

      chatbox.appendChild(msgDiv);
      chatbox.scrollTop = chatbox.scrollHeight;

      return { msgDiv, contentDiv, progressBar, progressText, progressContainer };
    }

    init();
  </script>
</body>
</html>
