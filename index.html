<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI 19.0 - Anti-Hallucination Edition</title>
  
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg: #070a12;
      --panel: #0f172a;
      --header: #020617;
      --accent: #38bdf8;
      --glow: #818cf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --user-msg: #4338ca;
      --bot-msg: #1e1b4b;
      --border: rgba(129, 140, 248, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 94vh;
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: var(--header);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-info h4 { margin: 0; font-size: 15px; color: var(--accent); }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: var(--glow); }

    .memory-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(129, 140, 248, 0.2);
      color: var(--glow);
      border: 1px solid var(--border);
    }

    .progress-container { width: 100%; background: rgba(255,255,255,0.05); height: 4px; }
    .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--glow)); transition: width 0.1s linear; }

    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user { 
      align-self: flex-end; 
      background: var(--user-msg); 
      color: #fff; 
      border-bottom-right-radius: 4px; 
      white-space: pre-wrap;
    }
    
    .bot { 
      align-self: flex-start; 
      background: var(--bot-msg); 
      color: var(--text); 
      border: 1px solid var(--border); 
      border-bottom-left-radius: 4px; 
    }

    /* Markdown Styling for Bot Messages */
    .bot p { margin: 0 0 10px 0; }
    .bot p:last-child { margin: 0; }
    .bot code { background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    .bot pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
    .bot pre code { background: none; padding: 0; }
    .bot ul, .bot ol { margin: 8px 0; padding-left: 20px; }

    .input-area { display: flex; padding: 12px 14px; background: var(--header); gap: 8px; }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }

    button.send-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--accent), var(--glow));
      color: #0f172a;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
    }
    button.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <h4>Kris AI 19.0 (Upgraded)</h4>
      <p id="engineStatus">● Initializing Engine...</p>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span id="memCount" class="memory-badge">🧠 Memory: 0</span>
      <button type="button" style="background:none;border:1px solid var(--border);color:var(--subtext);border-radius:6px;padding:4px 8px;cursor:pointer;" onclick="clearChat()">🧹 Clear</button>
    </div>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Loading Engine..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="send-btn" id="sendBtn" disabled onclick="sendMessage()">Send</button>
  </div>
</div>

    if (progress > 0) document.getElementById('progressBar').style.width = `${progress}%`;

    const chatBox = document.getElementById("chatBox");

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  window.clearChat = function() {

    document.getElementById("memCount").textContent = "🧠 Memory: 0";
    document.getElementById("chatBox").innerHTML = '';
