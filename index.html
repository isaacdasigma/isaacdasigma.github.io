<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI 16.1 - Speed Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --panel: #0f172a;
      --header: #020617;
      --accent: #38bdf8;
      --glow: #818cf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --user-msg: #4338ca;
      --bot-msg: #1e1b4b;
      --border: rgba(129, 140, 248, 0.2);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 94vh;
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: var(--header);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-info h4 { margin: 0; font-size: 15px; color: var(--accent); }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: var(--glow); }

    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.05);
      height: 4px;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--glow));
      transition: width 0.1s linear;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

    .input-area { display: flex; padding: 12px 14px; background: var(--header); gap: 8px; }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }

    button.send-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--accent), var(--glow));
      color: #0f172a;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 700;
    }
    button.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <h4>Kris AI 16.1 (Turbo Edition)</h4>
      <p id="engineStatus">● Initializing Turbo Engine...</p>
    </div>
    <button type="button" style="background:none;border:1px solid var(--border);color:var(--subtext);border-radius:6px;padding:4px 8px;cursor:pointer;" onclick="clearChat()">🧹 Clear</button>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Warming up..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="send-btn" id="sendBtn" disabled onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
  import { pipeline, env, TextStreamer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

  env.allowLocalModels = false;
  env.useBrowserCache = true;

  if (env.backends && env.backends.onnx && env.backends.onnx.wasm) {
    env.backends.onnx.wasm.numThreads = 1;
  }

  let generator = null;
  let history = [];

  function updateStatus(text, progress = 0) {
    document.getElementById('engineStatus').textContent = text;
    if (progress > 0) {
      document.getElementById('progressBar').style.width = `${progress}%`;
    }
  }

  function appendBotMessage(text) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = "message bot";
    msg.innerHTML = DOMPurify.sanitize(text);
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  window.clearChat = function() {
    history = [];
    document.getElementById("chatBox").innerHTML = '';
    appendBotMessage("Memory cleared!");
  };

  async function initEngine() {
    updateStatus(`● Loading 135M Model...`, 20);

    try {
      generator = await pipeline('text-generation', 'onnx-community/SmolLM2-135M-Instruct-ONNX', {
        device: 'wasm',
        dtype: 'q4',
        progress_callback: (p) => {
          if (p.status === 'progress') {
            updateStatus(`● Fetching Model (${Math.round(p.progress || 0)}%)...`, Math.round(p.progress || 0));
          }
        }
      });

      updateStatus(`● Ready (Turbo WASM)`, 100);
      document.getElementById('userInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('userInput').placeholder = 'Type a message...';
      appendBotMessage("<b>Engine Ready!</b> High-speed decoding active.");
    } catch (err) {
      updateStatus(`⚠️ Initialization Error`);
      appendBotMessage(`<b>Error:</b> ${err.message || err}`);
    }
  }

  window.sendMessage = async function() {
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const text = input.value.trim();

    if (!text || !generator) return;

    const chatBox = document.getElementById("chatBox");
    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.textContent = text;
    chatBox.appendChild(userMsg);

    input.value = "";
    input.disabled = true;
    sendBtn.disabled = true;

    // Keep history extremely minimal to speed up context prefill
    history.push({ role: 'user', content: text });
    if (history.length > 2) history = history.slice(-2);

    const activeBotMsg = document.createElement("div");
    activeBotMsg.className = "message bot";
    activeBotMsg.textContent = "...";
    chatBox.appendChild(activeBotMsg);

    // Compact system prompt reduces input processing time dramatically
    const messages = [
      { role: 'system', content: 'You are Kris AI, a witty, brilliant assistant. Be direct and brief.' },
      ...history
    ];

    let responseText = "";

    try {
      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: (chunk) => {
          responseText += chunk;
          activeBotMsg.textContent = responseText;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });

      // Optimized sampling parameters for maximum WASM generation speed
      const output = await generator(messages, {
        max_new_tokens: 120,
        do_sample: true,
        temperature: 0.4,
        top_k: 20,
        repetition_penalty: 1.25,
        no_repeat_ngram_size: 3,
        streamer: streamer
      });

      if (!responseText && output && output[0]) {
        const generatedText = output[0].generated_text;
        responseText = Array.isArray(generatedText) 
          ? generatedText[generatedText.length - 1].content 
          : String(generatedText);
        activeBotMsg.textContent = responseText;
      }

      history.push({ role: 'assistant', content: responseText.trim() });
    } catch (e) {
      console.error(e);
      activeBotMsg.textContent = `⚠️ Generation error.`;
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  };

  initEngine();
</script>
</body>
</html>
