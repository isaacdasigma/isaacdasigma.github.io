<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kris AI 14.1 - Ultra-Fast Local Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151d2a;
      --header: #0f172a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --user-msg: #0284c7;
      --bot-msg: #243144;
      --border: rgba(255, 255, 255, 0.1);
      --error: #f87171;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 94vh;
      background: var(--panel);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .chat-header {
      background: var(--header);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--header);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .header-info h4 { margin: 0; font-size: 15px; color: var(--text); }
    .header-info p { margin: 2px 0 0; font-size: 11px; color: var(--accent); }

    .status-bar {
      background: var(--header);
      padding: 8px 16px;
      font-size: 11px;
      color: var(--subtext);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.05);
      height: 4px;
      position: relative;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot-msg); color: var(--text); border-bottom-left-radius: 4px; }

    .debug-console {
      background: #090d16;
      border-top: 1px solid var(--border);
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      padding: 8px 12px;
      max-height: 70px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .input-area { display: flex; padding: 12px 14px; background: var(--header); gap: 8px; align-items: center; }
    
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }

    button.send-btn {
      padding: 12px 18px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      font-weight: 600;
    }
    button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="header-left">
      <div class="avatar">
        <svg width="22" height="22" viewBox="0 0 100 100" fill="none">
          <path d="M28 20 V80 M28 50 L70 20 M38 42 L72 80" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-info">
        <h4>Kris AI 14.1 (Standalone)</h4>
        <p id="engineStatus">● Booting Modern Engine...</p>
      </div>
    </div>
    <button type="button" style="background:none;border:1px solid var(--border);color:var(--subtext);border-radius:6px;padding:4px 8px;cursor:pointer;" onclick="clearMemory()">🧹 Clear</button>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="status-bar">
    <span id="modelInfo">Model: SmolLM2-135M-Instruct (INT4 Browser ONNX)</span>
    <span id="memCount">Memory: 0 turns</span>
  </div>

  <div class="chat-box" id="chatBox"></div>
  
  <div class="debug-console" id="debugConsole">SYSTEM LOGS: Initializing script module...</div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Loading local model..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="send-btn" id="sendBtn" disabled onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
  function logDebug(msg) {
    const consoleBox = document.getElementById('debugConsole');
    consoleBox.textContent += `\n> ${msg}`;
    consoleBox.scrollTop = consoleBox.scrollHeight;
    console.log(`[KrisAI] ${msg}`);
  }

  window.addEventListener('error', (e) => {
    logDebug(`Global Error: ${e.message}`);
  });

  try {
    logDebug("Importing @huggingface/transformers engine...");
    const { pipeline, env, TextStreamer } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers');
    
    env.allowLocalModels = false;
    if (env.backends?.onnx?.wasm) {
      env.backends.onnx.wasm.numThreads = 1;
    }

    let generator = null;
    let conversationHistory = [];

    if (window.location.protocol === 'file:') {
      logDebug("WARNING: File protocol detected. Use VS Code Live Server or 'npx serve' if CORS blocks fetch.");
    }

    function loadMemory() {
      const stored = localStorage.getItem('kris_standalone_history');
      conversationHistory = stored ? JSON.parse(stored) : [];
      updateMemoryUI();
      renderHistoryToDOM();
    }

    function saveMemory(role, content) {
      conversationHistory.push({ role, content });
      if (conversationHistory.length > 8) conversationHistory.shift();
      localStorage.setItem('kris_standalone_history', JSON.stringify(conversationHistory));
      updateMemoryUI();
    }

    window.clearMemory = function() {
      conversationHistory = [];
      localStorage.removeItem('kris_standalone_history');
      document.getElementById('chatBox').innerHTML = '';
      updateMemoryUI();
      appendBotMessage("Memory reset! Ask me anything—I'm running 100% locally in your browser.");
    };

    function updateMemoryUI() {
      document.getElementById('memCount').textContent = `Memory: ${conversationHistory.length} turns`;
    }

    async function initLocalAI() {
      const statusText = document.getElementById('engineStatus');
      const progressBar = document.getElementById('progressBar');

      const supportsWebGPU = !!navigator.gpu;
      const deviceOption = supportsWebGPU ? 'webgpu' : 'wasm';
      logDebug(`Selected Hardware Backend: ${deviceOption.toUpperCase()}`);

      try {
        statusText.textContent = `● Loading SmolLM2 (${deviceOption.toUpperCase()})...`;

        generator = await pipeline('text-generation', 'onnx-community/SmolLM2-135M-Instruct', {
          device: deviceOption,
          dtype: 'q4',
          progress_callback: (data) => {
            if (data.status === 'progress') {
              const pct = Math.round(data.progress || 0);
              progressBar.style.width = `${pct}%`;
              statusText.textContent = `● Downloading Model (${pct}%)...`;
            } else if (data.status === 'done') {
              logDebug(`Loaded component: ${data.file || 'weights'}`);
            }
          }
        });

        statusText.textContent = `● Engine Ready (${deviceOption.toUpperCase()})`;
        progressBar.style.width = '100%';
        logDebug("Model successfully loaded into memory!");

        document.getElementById('userInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('userInput').placeholder = 'Type a message...';
        
        loadMemory();
      } catch (err) {
        logDebug(`Engine Error: ${err.message}`);
        statusText.textContent = '⚠️ Engine Load Failed';
        statusText.style.color = 'var(--error)';
        appendBotMessage(`<b>Initialization Error:</b> ${err.message}<br><br>Check the debug console box below for details.`);
      }
    }

    async function generateResponse(promptText) {
      saveMemory("user", promptText);

      const activeContext = conversationHistory.slice(-4);
      let chatPrompt = `<|im_start|>system\nYou are Kris AI, a direct and helpful local browser assistant.<|im_end|>\n`;
      activeContext.forEach(m => {
        chatPrompt += `<|im_start|>${m.role === 'user' ? 'user' : 'assistant'}\n${m.content}<|im_end|>\n`;
      });
      chatPrompt += `<|im_start|>assistant\n`;

      const chatBox = document.getElementById("chatBox");
      const msg = document.createElement("div");
      msg.className = "message bot";
      chatBox.appendChild(msg);

      let fullReply = "";

      const streamer = new TextStreamer(generator.tokenizer, {
        skip_prompt: true,
        skip_special_tokens: true,
        callback_function: (text) => {
          fullReply += text;
          msg.textContent = fullReply;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });

      await generator(chatPrompt, {
        max_new_tokens: 120,
        do_sample: false,
        streamer: streamer,
        stop: ["<|im_end|>", "<|endoftext|>"]
      });

      saveMemory("assistant", fullReply.trim());
    }

    function appendUserMessage(text) {
      const chatBox = document.getElementById("chatBox");
      const msg = document.createElement("div");
      msg.className = "message user";
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendBotMessage(text) {
      const chatBox = document.getElementById("chatBox");
      const msg = document.createElement("div");
      msg.className = "message bot";
      msg.innerHTML = DOMPurify.sanitize(text);
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderHistoryToDOM() {
      document.getElementById("chatBox").innerHTML = '';
      if (conversationHistory.length === 0) {
        appendBotMessage("<b>Welcome to Kris AI 14.1 ⚡</b><br>I am fully running in your browser memory. No API keys required!");
        return;
      }
      conversationHistory.forEach(m => {
        if (m.role === 'user') appendUserMessage(m.content);
        if (m.role === 'assistant') appendBotMessage(m.content);
      });
    }

    window.sendMessage = async function() {
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");
      const text = input.value.trim();

      if (!text || !generator) return;

      appendUserMessage(text);
      input.value = "";
      input.disabled = true;
      sendBtn.disabled = true;

      try {
        await generateResponse(text);
      } catch (e) {
        logDebug(`Generation Error: ${e.message}`);
        appendBotMessage("⚠️ Error processing request locally.");
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    };

    initLocalAI();
  } catch (importErr) {
    logDebug(`Module Import Failed: ${importErr.message}`);
  }
</script>
</body>
</html>
