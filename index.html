<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kris AI 14.1 - Zero Crash Edition</title>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

<style>
:root {
  --bg: #0b0f19;
  --panel: #151d2a;
  --header: #0f172a;
  --accent: #38bdf8;
  --text: #f8fafc;
  --subtext: #94a3b8;
  --user-msg: #0284c7;
  --bot-msg: #243144;
  --border: rgba(255,255,255,0.1);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 10px;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.chat-container {
  width: 100%;
  max-width: 640px;
  height: 94vh;
  background: var(--panel);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.chat-header {
  background: var(--header);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.header-info h4 {
  margin: 0;
  font-size: 15px;
}

.header-info p {
  margin: 2px 0 0;
  color: var(--accent);
  font-size: 11px;
}

.progress-container {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.05);
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: var(--accent);
  transition: width 0.2s linear;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 16px;
  white-space: pre-wrap;
  word-wrap: break-word;
  line-height: 1.5;
  font-size: 14px;
}

.user {
  align-self: flex-end;
  background: var(--user-msg);
  color: white;
  border-bottom-right-radius: 4px;
}

.bot {
  align-self: flex-start;
  background: var(--bot-msg);
  border-bottom-left-radius: 4px;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--header);
}

input[type="text"] {
  flex: 1;
  padding: 12px 16px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  outline: none;
}

.send-btn {
  padding: 12px 18px;
  border: none;
  border-radius: 24px;
  cursor: pointer;
  font-weight: 600;
  background: var(--accent);
  color: #0f172a;
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>

<body>

<div class="chat-container">

  <div class="chat-header">
    <div class="header-info">
      <h4>Kris AI 14.1 (Zero Crash)</h4>
      <p id="engineStatus">● Initializing...</p>
    </div>

    <button
      onclick="clearChat()"
      style="background:none;border:1px solid var(--border);color:var(--subtext);padding:4px 8px;border-radius:6px;cursor:pointer;">
      🧹 Clear
    </button>
  </div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      disabled
      placeholder="Loading low-RAM engine..."
      onkeydown="if(event.key==='Enter') sendMessage()">
      
    <button
      id="sendBtn"
      class="send-btn"
      disabled
      onclick="sendMessage()">
      Send
    </button>
  </div>

</div>

<script type="module">

import {
  pipeline,
  env,
  TextStreamer
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2";

env.allowLocalModels = false;
env.allowRemoteModels = true;
env.useBrowserCache = true;

if (env.backends?.onnx?.wasm) {
  env.backends.onnx.wasm.numThreads = 1;
  env.backends.onnx.wasm.proxy = false;
}

let generator = null;
let history = [];

function updateStatus(text, progress = 0) {
  document.getElementById("engineStatus").textContent = text;

  if (progress > 0) {
    document.getElementById("progressBar").style.width =
      progress + "%";
  }
}

function appendBotMessage(text) {
  const chatBox = document.getElementById("chatBox");

  const msg = document.createElement("div");
  msg.className = "message bot";

  if (window.DOMPurify) {
    msg.innerHTML = DOMPurify.sanitize(text);
  } else {
    msg.textContent = text;
  }

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

window.clearChat = function () {
  history = [];
  document.getElementById("chatBox").innerHTML = "";

  appendBotMessage(
    "<b>Memory cleared!</b><br>What can I help you with?"
  );
};

async function initEngine() {

  updateStatus("● Loading 135M Model (WASM)...", 10);

  try {

    generator = await pipeline(
      "text-generation",
      "onnx-community/SmolLM2-135M-Instruct-ONNX",
      {
        device: "wasm",
        dtype: "q4",
        progress_callback: (progress) => {

          if (progress.status === "progress") {

            const percent =
              Math.round(progress.progress || 0);

            updateStatus(
              `● Loading Model (${percent}%)...`,
              percent
            );
          }
        }
      }
    );
